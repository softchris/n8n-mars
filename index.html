<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course for Mars</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <div id="text">
    <div id="head"></div>
    <div id="body"></div><span id="cursor"></span>
  </div>
  <div id="title"></div>

  <div id="debug"></div>

  <div id="hud"></div>
  <div id="mission" class="glass"></div>
  <div id="list" class="glass"></div>

  <div id="start">
    <div class="inner">
      <h1>COURSE FOR MARS</h1>
      <p class="sub">An opening sequence</p>
      <div class="btns"><button id="go">NEW GAME</button><button id="skip" class="ghost">SKIP INTRO</button><button id="cont" class="ghost" hidden>CONTINUE</button></div>
      <p id="saveinfo"></p>
      <p class="hint">Sound on. Best in fullscreen (F).</p>
      <p id="loading">Preparing the ship&hellip;</p>
      <p class="credit">Music: “Also Sprach Zarathustra” by Kevin MacLeod (<a href="https://incompetech.com" target="_blank" rel="noopener">incompetech.com</a>) · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a></p>
    </div>
  </div>

  <audio id="music" preload="auto"></audio>

  <!-- Three.js r147 from CDN (last release that ships the classic examples/js postprocessing scripts) -->
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/ship.js"></script>
  <script src="js/space.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/typer.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/music.js"></script>
  <script src="js/cutscenes3d.js"></script>
  <script src="js/cutscenes.js"></script>
  <script src="js/n8n.js"></script>
  <script src="js/mission-sim.js"></script>
  <script src="js/dev-solutions.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/save.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
